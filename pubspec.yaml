name: agripulse_mobile
description: "AgriPulse (किसानमित्र) - Autonomous Multimodal Agronomy & Market Orchestrator Mobile App"
publish_to: 'none'
version: 1.0.0+1

environment:
  sdk: '>=3.3.0 <4.0.0'
  flutter: ">=3.19.0"

dependencies:
  flutter:
    sdk: flutter
  flutter_localizations:
    sdk: flutter

  # State Management (MVVM Pattern)
  provider: ^6.1.2

  # Networking & API
  http: ^1.2.1
  http_parser: ^4.0.2

  # Local Persistence & Offline Sync
  shared_preferences: ^2.2.3

  # Geolocation
  geolocator: ^12.0.0

  # Media & Hardware
  image_picker: ^1.1.2
  cached_network_image: ^3.3.1

  # Audio playback
  audioplayers: ^6.0.0
  path_provider: ^2.1.3

  # Utilities
  intl: any
  url_launcher: ^6.3.0

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^3.0.0

flutter:
  uses-material-design: true
